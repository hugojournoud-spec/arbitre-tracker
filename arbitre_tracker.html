<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Arbitre Elite 2 — Été 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg:       #080810;
  --bg2:      #0f0f1a;
  --bg3:      #141422;
  --bg4:      #1a1a2e;
  --border:   #1e1e35;
  --gold:     #C9A84C;
  --gold2:    #e8c96a;
  --white:    #f0f0ff;
  --grey:     #6a6a8a;
  --grey2:    #3a3a5a;
  --meca:     #6ab0ff;
  --jug:      #b08aff;
  --crew:     #7adf9a;
  --scout:    #ff9a5a;
  --pregame:  #f7d06a;
  --muscu:    #ff7a7a;
  --cardio:   #ffb347;
  --regle:    #5de0d8;
  --coaching: #C9A84C;
  --stage:    #e0e05d;
  --done:     #2a3a2a;
  --done-border: #4a8a4a;
  --done-text: #7adf7a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
.app-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
}
.app-title span { color: var(--gold); }
.header-stats {
  display: flex;
  gap: 16px;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
}
.hstat { color: var(--grey); }
.hstat b { color: var(--gold); }

/* ── LAYOUT ── */
.layout {
  display: flex;
  min-height: calc(100vh - 52px);
}

/* ── SIDEBAR ── */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar-section {
  padding: 0 12px;
  margin-bottom: 8px;
}
.sidebar-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--grey2);
  padding: 8px 4px 4px;
}
.nav-item {
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--grey);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all .15s;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--bg3); color: var(--white); }
.nav-item.active { background: var(--bg4); color: var(--white); border-color: var(--gold); }
.nav-item .nav-week { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--gold); min-width: 28px; }
.nav-item .nav-prog {
  width: 100%;
  height: 3px;
  background: var(--bg4);
  border-radius: 2px;
  margin-top: 3px;
  overflow: hidden;
}
.nav-item .nav-prog-fill {
  height: 100%;
  background: var(--done-text);
  border-radius: 2px;
  transition: width .3s;
}
.phase-divider {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 10px 4px;
  color: var(--grey2);
  border-top: 1px solid var(--border);
  margin-top: 6px;
}

/* ── MAIN ── */
.main {
  flex: 1;
  padding: 24px 20px;
  overflow-y: auto;
  max-width: 900px;
}

/* ── WEEK CARD ── */
.week-card {
  display: none;
}
.week-card.active { display: block; }

.week-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
}
.week-num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 3.5rem;
  color: var(--gold);
  line-height: 1;
  opacity: .25;
  min-width: 80px;
  text-align: right;
}
.week-info { flex: 1; }
.week-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--white);
  margin-bottom: 2px;
}
.week-dates {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--gold);
  margin-bottom: 6px;
}
.week-desc {
  font-size: 0.82rem;
  color: var(--grey);
  line-height: 1.55;
}

/* ── PROGRESS BAR ── */
.week-progress {
  background: var(--bg3);
  border-radius: 4px;
  padding: 10px 14px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.prog-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--grey);
  min-width: 80px;
}
.prog-bar {
  flex: 1;
  height: 6px;
  background: var(--bg4);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--done-text), #a0ffa0);
  border-radius: 3px;
  transition: width .4s ease;
}
.prog-pct {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--done-text);
  min-width: 32px;
  text-align: right;
}

/* ── ALERT ── */
.alert-box {
  border-left: 3px solid var(--cardio);
  background: #1a1408;
  padding: 8px 12px;
  border-radius: 0 5px 5px 0;
  font-size: 0.78rem;
  color: var(--cardio);
  margin-bottom: 14px;
}
.coaching-box {
  border: 1px solid var(--gold);
  background: #1a1208;
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 14px;
}
.coaching-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 4px;
}
.coaching-body { font-size: 0.78rem; color: var(--grey); line-height: 1.5; }

/* ── SÉANCES GRID ── */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--grey2);
  margin-bottom: 8px;
  margin-top: 16px;
}
.seances-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
  margin-bottom: 8px;
}

/* ── SÉANCE CARD ── */
.seance {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.seance:hover { border-color: var(--grey2); transform: translateY(-1px); }
.seance.done {
  background: var(--done);
  border-color: var(--done-border);
}
.seance.done::after {
  content: '✓';
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 1rem;
  color: var(--done-text);
  font-weight: bold;
}
.seance-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.seance-jour {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--grey);
  background: var(--bg3);
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: 1px;
}
.seance-type {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 3px;
}
.seance-title {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--white);
  line-height: 1.3;
  margin-bottom: 4px;
}
.seance.done .seance-title { color: var(--done-text); }
.seance-corps {
  font-size: 0.72rem;
  color: var(--grey);
  line-height: 1.45;
}
.seance-actions {
  margin-top: 8px;
  display: flex;
  gap: 6px;
}
.btn-done {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  letter-spacing: .5px;
}
.btn-done.not-done {
  background: transparent;
  border-color: var(--grey2);
  color: var(--grey);
}
.btn-done.not-done:hover { border-color: var(--done-text); color: var(--done-text); }
.btn-done.is-done {
  background: var(--done);
  border-color: var(--done-border);
  color: var(--done-text);
}
.btn-comment {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--grey2);
  background: transparent;
  color: var(--grey);
  transition: all .15s;
  letter-spacing: .5px;
}
.btn-comment:hover { border-color: var(--gold); color: var(--gold); }

/* ── COMMENT AREA ── */
.comment-area {
  display: none;
  margin-top: 8px;
}
.comment-area.open { display: block; }
.comment-area textarea {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  padding: 8px;
  resize: vertical;
  min-height: 60px;
  outline: none;
  transition: border-color .15s;
}
.comment-area textarea:focus { border-color: var(--gold); }
.comment-area .save-btn {
  margin-top: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  transition: all .15s;
}
.comment-area .save-btn:hover { background: var(--gold); color: var(--bg); }
.comment-display {
  margin-top: 6px;
  font-size: 0.72rem;
  color: var(--gold2);
  font-style: italic;
  background: #1a1208;
  padding: 6px 8px;
  border-radius: 4px;
  border-left: 2px solid var(--gold);
  white-space: pre-wrap;
  display: none;
}
.comment-display.has-comment { display: block; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 24px;
  max-width: 480px;
  width: 92%;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-type { font-family: 'DM Mono', monospace; font-size: 0.65rem; }
.modal-title { font-family: 'Syne', sans-serif; font-size: 1rem; color: var(--white); }
.modal-jour { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--grey); }
.modal-body { font-size: 0.82rem; color: var(--grey); line-height: 1.65; margin-bottom: 16px; }
.modal-body b { color: var(--white); }
.modal-section { margin-bottom: 14px; }
.modal-section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--grey2);
  margin-bottom: 6px;
}
.modal-textarea {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  padding: 10px;
  resize: vertical;
  min-height: 70px;
  outline: none;
  transition: border-color .15s;
}
.modal-textarea:focus { border-color: var(--gold); }
.modal-footer {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.modal-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  letter-spacing: .5px;
}
.modal-btn.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
}
.modal-btn.primary:hover { background: var(--gold2); }
.modal-btn.secondary {
  background: transparent;
  border-color: var(--grey2);
  color: var(--grey);
}
.modal-btn.secondary:hover { border-color: var(--white); color: var(--white); }
.modal-btn.danger {
  background: transparent;
  border-color: #5a2020;
  color: #ff7a7a;
}
.modal-btn.danger:hover { background: #2a1010; }
.modal-close-x {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--grey);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0 4px;
}
.modal-close-x:hover { color: var(--white); }

/* ── NOTE GLOBALE SEMAINE ── */
.week-note-section {
  margin-top: 20px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.week-note-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.week-note-textarea {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  padding: 10px;
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color .15s;
}
.week-note-textarea:focus { border-color: var(--gold); }
.week-note-save {
  margin-top: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  transition: all .15s;
}
.week-note-save:hover { background: var(--gold); color: var(--bg); }
.saved-note {
  margin-top: 8px;
  font-size: 0.78rem;
  color: var(--grey);
  font-style: italic;
  white-space: pre-wrap;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--grey2); border-radius: 3px; }

/* ── TYPE COLORS ── */
.t-meca    { background: #122030; color: var(--meca); border-color: #1e3a5f; }
.t-jug     { background: #18122a; color: var(--jug); border-color: #301d50; }
.t-crew    { background: #121e14; color: var(--crew); border-color: #183a20; }
.t-scout   { background: #1e1210; color: var(--scout); border-color: #3a1e10; }
.t-pregame { background: #201a08; color: var(--pregame); border-color: #503a10; }
.t-muscu   { background: #201210; color: var(--muscu); border-color: #481510; }
.t-cardio  { background: #201808; color: var(--cardio); border-color: #483008; }
.t-regle   { background: #0e1c1c; color: var(--regle); border-color: #123838; }
.t-coaching{ background: #1a1005; color: var(--coaching); border-color: #3a2a05; }
.t-stage   { background: #181808; color: var(--stage); border-color: #383808; }
.t-repos   { background: #0a0a0d; color: var(--grey2); border-color: #111118; }

/* ── SYNC BAR ── */
.sync-bar {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
}
.sync-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--grey2);
  margin-right: 4px;
}
.sync-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  padding: 5px 13px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  letter-spacing: .5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.sync-btn.export-btn {
  background: transparent;
  border-color: var(--gold);
  color: var(--gold);
}
.sync-btn.export-btn:hover { background: var(--gold); color: var(--bg); }
.sync-btn.import-btn {
  background: transparent;
  border-color: var(--grey2);
  color: var(--grey);
}
.sync-btn.import-btn:hover { border-color: var(--white); color: var(--white); }
.sync-btn.reset-btn {
  background: transparent;
  border-color: #3a1515;
  color: #ff7a7a;
}
.sync-btn.reset-btn:hover { background: #2a1010; }
.sync-status {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--done-text);
  margin-left: auto;
  opacity: 0;
  transition: opacity .3s;
}
.sync-status.show { opacity: 1; }
.sync-info {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  color: var(--grey2);
  margin-left: auto;
}
/* Adjust main content to not be hidden by sync bar */
.layout { padding-bottom: 46px; }
#hiddenImport { display: none; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg3);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 10px 20px;
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--white);
  z-index: 300;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Tracker <span>Arbitre Elite 2</span></div>
  <div class="header-stats">
    <div class="hstat">Séances : <b id="hTotal">0</b></div>
    <div class="hstat">Faites : <b id="hDone">0</b></div>
    <div class="hstat">Progression : <b id="hPct">0%</b></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-type" id="mType"></div>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-jour" id="mJour"></div>
      </div>
      <button class="modal-close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-section">
      <div class="modal-section-label">Ce que j'ai réellement fait</div>
      <textarea class="modal-textarea" id="mRealise" placeholder="Décris ce que tu as réellement fait, la durée, les difficultés..."></textarea>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">Ressenti & commentaires</div>
      <textarea class="modal-textarea" id="mComment" placeholder="Points positifs, difficultés, ce que tu ferais différemment..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="modal-btn primary" onclick="saveModal()">Sauvegarder</button>
      <button class="modal-btn secondary" onclick="markDoneModal()">Marquer comme fait ✓</button>
      <button class="modal-btn danger" onclick="resetModal()">Réinitialiser</button>
      <button class="modal-btn secondary" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
// ── DONNÉES ─────────────────────────────────────────────────────────────
const WEEKS = [
 {num:1,phase:'BLOC 1 — FONDATIONS',phaseColor:'#6ab0ff',dates:'9 – 15 juin',
  desc:"Première semaine. Remise en route progressive. Bases 3PO et règlement Art. 1-10.",
  alert:"Cardio très progressif — écoute du genou (syndrome essuie-glace).",
  coaching:null,
  seances:[
   {id:'w1-phy-lun',jour:'LUN',cat:'physique',type:'MUSCU',tc:'t-muscu',titre:'Musculation — PULL',corps:'Séance dos/biceps à ta convenance.'},

// ── STORAGE ─────────────────────────────────────────────────────────────
function load() {
  try { return JSON.parse(localStorage.getItem('arbitre_tracker_v1') || '{}'); }
  catch(e) { return {}; }
}
function save(data) {
  try { localStorage.setItem('arbitre_tracker_v1', JSON.stringify(data)); } catch(e) {}
}
let STATE = load();

function getSeance(id) { return STATE[id] || {done:false, realise:'', comment:''}; }
function setSeance(id, obj) { STATE[id] = obj; save(STATE); }

// ── MODAL STATE ──────────────────────────────────────────────────────────
let currentModalId = null;

function openModal(id) {
  currentModalId = id;
  const week = WEEKS.find(w => w.seances.some(s => s.id === id));
  const seance = week.seances.find(s => s.id === id);
  const st = getSeance(id);

  const typeMap = {
    't-meca':'VIDÉO MÉCANIQUE','t-jug':'VIDÉO JUGEMENT','t-crew':'VIDÉO CREW',
    't-scout':'SCOUTING','t-pregame':'PRE-GAME','t-muscu':'MUSCULATION',
    't-cardio':'CARDIO','t-regle':'RÈGLEMENT / QCM','t-coaching':'COACHING',
    't-stage':'STAGE FFBB','t-repos':'REPOS'
  };
  const typeEl = document.getElementById('mType');
  typeEl.textContent = seance.type;
  typeEl.className = `modal-type seance-type ${seance.tc}`;

  document.getElementById('mTitle').textContent = seance.titre;
  document.getElementById('mJour').textContent = `${seance.jour} · Semaine ${week.num}`;
  document.getElementById('mBody').innerHTML = seance.corps.replace(/\n/g,'<br>');
  document.getElementById('mRealise').value = st.realise || '';
  document.getElementById('mComment').value = st.comment || '';

  document.getElementById('modalOverlay').classList.add('open');
}

function saveModal() {
  if (!currentModalId) return;
  const st = getSeance(currentModalId);
  st.realise = document.getElementById('mRealise').value;
  st.comment = document.getElementById('mComment').value;
  setSeance(currentModalId, st);
  refreshCard(currentModalId);
  updateGlobalStats();
  closeModal();
}

function markDoneModal() {
  if (!currentModalId) return;
  const st = getSeance(currentModalId);
  st.done = !st.done;
  st.realise = document.getElementById('mRealise').value;
  st.comment = document.getElementById('mComment').value;
  setSeance(currentModalId, st);
  refreshCard(currentModalId);
  updateGlobalStats();
  closeModal();
}

function resetModal() {
  if (!currentModalId) return;
  if (!confirm('Réinitialiser cette séance ? Commentaires supprimés.')) return;
  setSeance(currentModalId, {done:false, realise:'', comment:''});
  refreshCard(currentModalId);
  updateGlobalStats();
  closeModal();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentModalId = null;
}
function closeModalOutside(e) { if(e.target.id==='modalOverlay') closeModal(); }

// ── RENDER ───────────────────────────────────────────────────────────────
function refreshCard(id) {
  const el = document.getElementById('card-'+id);
  if (!el) return;
  const st = getSeance(id);
  el.classList.toggle('done', st.done);
  const btn = el.querySelector('.btn-done');
  if(btn){
    btn.className = 'btn-done ' + (st.done ? 'is-done' : 'not-done');
    btn.textContent = st.done ? '✓ Fait' : 'Marquer fait';
  }
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let lastPhase = '';
  WEEKS.forEach(w => {
    if (w.phase !== lastPhase) {
      lastPhase = w.phase;
      const div = document.createElement('div');
      div.className = 'phase-divider';
      div.textContent = w.phase;
      sb.appendChild(div);
    }
    const total = w.seances.length;
    const done = w.seances.filter(s => getSeance(s.id).done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const item = document.createElement('div');
    item.className = 'nav-item' + (w.num===1?' active':'');
    item.id = 'nav-w'+w.num;
    item.onclick = () => selectWeek(w.num);
    item.innerHTML = `<span class="nav-week">S${w.num}</span><span style="flex:1;font-size:.75rem">${w.dates}</span>
      <div class="nav-prog"><div class="nav-prog-fill" id="npf-${w.num}" style="width:${pct}%"></div></div>`;
    sb.appendChild(item);
  });
}

function buildMain() {
  const main = document.getElementById('main');
  WEEKS.forEach(w => {
    const card = document.createElement('div');
    card.className = 'week-card' + (w.num===1?' active':'');
    card.id = 'week-'+w.num;

    let html = `
      <div class="week-header">
        <div class="week-num">${String(w.num).padStart(2,'0')}</div>
        <div class="week-info">
          <div class="week-title">Semaine ${w.num}</div>
          <div class="week-dates">${w.dates}</div>
          <div class="week-desc">${w.desc}</div>
        </div>
      </div>
      <div class="week-progress">
        <div class="prog-label">Progression</div>
        <div class="prog-bar"><div class="prog-fill" id="wpf-${w.num}" style="width:0%"></div></div>
        <div class="prog-pct" id="wpp-${w.num}">0%</div>
      </div>`;

    if(w.alert) html += `<div class="alert-box">⚠  ${w.alert}</div>`;
    if(w.coaching) html += `
      <div class="coaching-box">
        <div class="coaching-title">🎯  ${w.coaching.date}  —  ${w.coaching.titre}</div>
        <div class="coaching-body">${w.coaching.corps.replace(/\n/g,'<br>')}</div>
      </div>`;

    // Séances physique
    const phy = w.seances.filter(s=>s.cat==='physique');
    if(phy.length) {
      html += `<div class="section-label">Physique</div><div class="seances-grid">`;
      phy.forEach(s => { html += buildSeanceCard(s); });
      html += `</div>`;
    }

    // Séances arbitrage
    const arb = w.seances.filter(s=>s.cat==='arbitrage');
    if(arb.length) {
      html += `<div class="section-label">Arbitrage · 1h30/séance</div><div class="seances-grid">`;
      arb.forEach(s => { html += buildSeanceCard(s); });
      html += `</div>`;
    }

    // Note de semaine
    html += `
      <div class="week-note-section">
        <div class="week-note-title">📝 Note globale de la semaine</div>
        <textarea class="week-note-textarea" id="wnote-${w.num}" placeholder="Bilan de la semaine, ressenti général, ce qui a été différent du plan...">${STATE['week-note-'+w.num]||''}</textarea>
        <button class="week-note-save" onclick="saveWeekNote(${w.num})">Sauvegarder la note</button>
        <div class="saved-note" id="wsnote-${w.num}">${STATE['week-note-'+w.num]||''}</div>
      </div>`;

    card.innerHTML = html;
    main.appendChild(card);
  });

  // Events après rendu
  WEEKS.forEach(w => {
    w.seances.forEach(s => {
      const el = document.getElementById('card-'+s.id);
      if(el) {
        const st = getSeance(s.id);
        el.classList.toggle('done', st.done);
        const btn = el.querySelector('.btn-done');
        if(btn) {
          btn.className = 'btn-done ' + (st.done ? 'is-done' : 'not-done');
          btn.textContent = st.done ? '✓ Fait' : 'Marquer fait';
        }
      }
    });
    updateWeekProgress(w.num);
  });
}

function buildSeanceCard(s) {
  return `
    <div class="seance" id="card-${s.id}" onclick="openModal('${s.id}')">
      <div class="seance-top">
        <span class="seance-jour">${s.jour}</span>
        <span class="seance-type ${s.tc}">${s.type}</span>
      </div>
      <div class="seance-title">${s.titre}</div>
      ${s.corps ? `<div class="seance-corps">${s.corps.substring(0,80)}${s.corps.length>80?'…':''}</div>` : ''}
      <div class="seance-actions" onclick="event.stopPropagation()">
        <button class="btn-done not-done" onclick="quickToggle('${s.id}')">Marquer fait</button>
        <button class="btn-comment" onclick="openModal('${s.id}')">Détail / Note</button>
      </div>
    </div>`;
}

function quickToggle(id) {
  const st = getSeance(id);
  st.done = !st.done;
  setSeance(id, st);
  refreshCard(id);
  const weekNum = WEEKS.find(w => w.seances.some(s => s.id===id))?.num;
  if(weekNum) updateWeekProgress(weekNum);
  updateGlobalStats();
  updateNavProg(weekNum);
}

function saveWeekNote(num) {
  const val = document.getElementById('wnote-'+num).value;
  STATE['week-note-'+num] = val;
  save(STATE);
  const el = document.getElementById('wsnote-'+num);
  if(el) el.textContent = val;
}

function selectWeek(num) {
  document.querySelectorAll('.week-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('week-'+num).classList.add('active');
  document.getElementById('nav-w'+num).classList.add('active');
}

function updateWeekProgress(num) {
  const w = WEEKS.find(x=>x.num===num);
  if(!w) return;
  const total = w.seances.length;
  const done = w.seances.filter(s=>getSeance(s.id).done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const bar = document.getElementById('wpf-'+num);
  const lbl = document.getElementById('wpp-'+num);
  if(bar) bar.style.width = pct+'%';
  if(lbl) lbl.textContent = pct+'%';
}

function updateNavProg(num) {
  const w = WEEKS.find(x=>x.num===num);
  if(!w) return;
  const total = w.seances.length;
  const done = w.seances.filter(s=>getSeance(s.id).done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const el = document.getElementById('npf-'+num);
  if(el) el.style.width = pct+'%';
}

function updateGlobalStats() {
  let total = 0, done = 0;
  WEEKS.forEach(w => {
    total += w.seances.length;
    done += w.seances.filter(s=>getSeance(s.id).done).length;
  });
  document.getElementById('hTotal').textContent = total;
  document.getElementById('hDone').textContent = done;
  document.getElementById('hPct').textContent = total ? Math.round(done/total*100)+'%' : '0%';
}

// ── INIT ─────────────────────────────────────────────────────────────────
buildSidebar();
buildMain();
updateGlobalStats();
WEEKS.forEach(w => { updateWeekProgress(w.num); updateNavProg(w.num); });
</script>

<!-- SYNC BAR -->
<div class="sync-bar">
  <span class="sync-label">Sync</span>
  <button class="sync-btn export-btn" onclick="openSyncModal('export')">⬇ Exporter</button>
  <button class="sync-btn import-btn" onclick="openSyncModal('import')">⬆ Importer</button>
  <button class="sync-btn reset-btn" onclick="confirmReset()">✕ Effacer tout</button>
  <span class="sync-info" id="syncInfo">—</span>
</div>

<!-- SYNC MODAL -->
<div class="modal-overlay" id="syncOverlay" onclick="closeSyncOutside(event)">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <div>
        <div class="modal-type" id="syncModalType" style="color:var(--gold);font-family:'DM Mono',monospace;font-size:.7rem"></div>
        <div class="modal-title" id="syncModalTitle"></div>
      </div>
      <button class="modal-close-x" onclick="closeSyncModal()">✕</button>
    </div>
    <div id="syncModalBody"></div>
    <div class="modal-footer" style="margin-top:14px">
      <button class="modal-btn secondary" onclick="closeSyncModal()">Fermer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SYNC MODAL ────────────────────────────────────────────────────────────
function openSyncModal(mode) {
  const overlay = document.getElementById('syncOverlay');
  const body = document.getElementById('syncModalBody');
  const title = document.getElementById('syncModalTitle');
  const type = document.getElementById('syncModalType');

  if (mode === 'export') {
    type.textContent = 'EXPORT — PC vers iPhone';
    title.textContent = 'Copie tes données';

    const jsonStr = JSON.stringify({
      app: 'Tracker Arbitre Elite 2',
      version: 1,
      exportedAt: new Date().toISOString(),
      data: load()
    }, null, 2);

    body.innerHTML = `
      <p style="font-size:.8rem;color:var(--grey);margin-bottom:12px;line-height:1.55">
        <b style="color:var(--white)">Comment faire :</b><br>
        1. Clique le bouton ci-dessous pour copier le code<br>
        2. Ouvre <b style="color:var(--gold)">Notes</b> sur ton iPhone et colle le texte<br>
        3. Sur l'iPhone : ouvre l'app → Importer → colle depuis Notes
      </p>
      <textarea id="exportTextarea" readonly style="
        width:100%;height:160px;background:var(--bg4);border:1px solid var(--border);
        border-radius:6px;color:var(--regle);font-family:'DM Mono',monospace;
        font-size:0.62rem;padding:10px;resize:none;outline:none;line-height:1.4
      ">${jsonStr.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="modal-btn primary" onclick="copyExport()" id="copyBtn">
          📋 Copier le code
        </button>
        <span style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);
          align-self:center" id="copyConfirm"></span>
      </div>
      <p style="font-size:.72rem;color:var(--grey2);margin-top:10px;font-family:'DM Mono',monospace">
        ${Object.keys(load()).length} entrées · généré le ${new Date().toLocaleString('fr-FR')}
      </p>
    `;
    // Set real value (not HTML-escaped) for copying
    setTimeout(() => {
      const ta = document.getElementById('exportTextarea');
      if (ta) ta.value = jsonStr;
    }, 10);

  } else {
    type.textContent = 'IMPORT — iPhone vers PC';
    title.textContent = 'Colle tes données';

    body.innerHTML = `
      <p style="font-size:.8rem;color:var(--grey);margin-bottom:12px;line-height:1.55">
        <b style="color:var(--white)">Comment faire :</b><br>
        1. Sur l'iPhone : ouvre l'app → Exporter → Copier le code<br>
        2. Ici : colle le code dans la zone ci-dessous<br>
        3. Clique <b style="color:var(--gold)">Charger</b>
      </p>
      <textarea id="importTextarea" placeholder="Colle ici le code copié depuis ton iPhone..." style="
        width:100%;height:160px;background:var(--bg4);border:1px solid var(--border);
        border-radius:6px;color:var(--white);font-family:'DM Mono',monospace;
        font-size:0.62rem;padding:10px;resize:none;outline:none;line-height:1.4
      "></textarea>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="modal-btn primary" onclick="doImport()">⬆ Charger les données</button>
      </div>
      <p style="font-size:.72rem;color:#ff7a7a;margin-top:10px;font-family:'DM Mono',monospace">
        ⚠ Tes données actuelles seront remplacées. Exporte d'abord si besoin !
      </p>
    `;
  }

  overlay.classList.add('open');
}

function copyExport() {
  const ta = document.getElementById('exportTextarea');
  if (!ta) return;
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      document.getElementById('copyBtn').textContent = '✓ Copié !';
      document.getElementById('copyBtn').style.background = 'var(--done)';
      document.getElementById('copyBtn').style.borderColor = 'var(--done-border)';
      document.getElementById('copyBtn').style.color = 'var(--done-text)';
      document.getElementById('copyConfirm').textContent = 'Code copié — colle-le dans Notes sur iPhone';
    });
  } catch(e) {
    // Fallback
    document.execCommand('copy');
    document.getElementById('copyBtn').textContent = '✓ Copié !';
    document.getElementById('copyConfirm').textContent = 'Code copié !';
  }
}

function doImport() {
  const ta = document.getElementById('importTextarea');
  if (!ta || !ta.value.trim()) { showToast('Colle d\'abord le code dans la zone'); return; }
  try {
    const obj = JSON.parse(ta.value.trim());
    if (!obj.data || typeof obj.data !== 'object') { showToast('❌ Code invalide'); return; }

    const exportedAt = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('fr-FR') : 'date inconnue';
    const entries = Object.keys(obj.data).length;

    if (!confirm(`Importer les données du ${exportedAt} ?\n${entries} entrées trouvées.\n\nATTENTION : tes données actuelles seront remplacées.`)) return;

    STATE = obj.data;
    save(STATE);

    WEEKS.forEach(w => {
      w.seances.forEach(s => { refreshCard(s.id); });
      const noteEl = document.getElementById('wnote-'+w.num);
      if(noteEl) noteEl.value = STATE['week-note-'+w.num] || '';
      const snoteEl = document.getElementById('wsnote-'+w.num);
      if(snoteEl) snoteEl.textContent = STATE['week-note-'+w.num] || '';
      updateWeekProgress(w.num);
      updateNavProg(w.num);
    });
    updateGlobalStats();
    updateSyncInfo();
    closeSyncModal();
    showToast(`✓ Import réussi — ${entries} entrées chargées`);
  } catch(e) {
    showToast('❌ Code invalide — vérifie que tu as tout copié');
  }
}

function closeSyncModal() { document.getElementById('syncOverlay').classList.remove('open'); }
function closeSyncOutside(e) { if(e.target.id==='syncOverlay') closeSyncModal(); }

// ── RESET TOTAL ────────────────────────────────────────────────────────────
function confirmReset() {
  if (!confirm('Effacer TOUTES tes données ?\nCette action est irréversible.\n\nExporte d\'abord tes données si tu veux les garder !')) return;
  STATE = {};
  save(STATE);
  WEEKS.forEach(w => {
    w.seances.forEach(s => refreshCard(s.id));
    updateWeekProgress(w.num);
    updateNavProg(w.num);
  });
  updateGlobalStats();
  updateSyncInfo();
  showToast('Données effacées');
}

// ── TOAST ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── SYNC INFO ──────────────────────────────────────────────────────────────
function updateSyncInfo() {
  const el = document.getElementById('syncInfo');
  const entries = Object.keys(load()).length;
  el.textContent = entries === 0 ? 'Aucune donnée' : `${entries} entrées sauvegardées`;
}

updateSyncInfo();
</script>

</body>
</html>
